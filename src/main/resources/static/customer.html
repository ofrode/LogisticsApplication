<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Customer - Logistics Application</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body data-page="customer">
  <div class="page-shell">
    <header class="site-header">
      <div class="container header-row">
        <a class="brand" href="/">
          <span class="brand__mark">LA</span>
          <span class="brand__text">
            <strong>Customer</strong>
            <small>Client area</small>
          </span>
        </a>
        <nav class="nav-menu nav-menu--static" aria-label="Навигация">
          <a href="/">Главная</a>
          <a href="/auth.html">Доступ</a>
        </nav>
      </div>
    </header>

    <main class="page-main">
      <section class="dashboard-hero dashboard-hero--customer">
        <div class="container dashboard-hero__grid">
          <div>
            <p class="eyebrow">Customer dashboard</p>
            <h1>Мои заявки</h1>
            <p>Клиент видит только свои отправления, их статусы, маршруты и назначенного менеджера.</p>
          </div>
          <div class="dashboard-badge">Client view</div>
        </div>
      </section>

      <section class="section">
        <div class="container admin-sections">
          <section class="panel-card admin-section">
            <div class="panel-card__header panel-card__header--split">
              <div>
                <h2>Мои отправления</h2>
                <p class="panel-card__text">Заявки, привязанные к текущему пользователю.</p>
              </div>
              <button class="button button--secondary" type="button" id="refresh-customer-shipments-button">Обновить</button>
            </div>
            <div class="stats-grid stats-grid--compact">
              <article class="stat-card"><span>Всего заявок</span><strong data-customer-stat="total">0</strong></article>
              <article class="stat-card"><span>Создано</span><strong data-customer-stat="created">0</strong></article>
              <article class="stat-card"><span>В пути</span><strong data-customer-stat="transit">0</strong></article>
              <article class="stat-card"><span>Доставлено</span><strong data-customer-stat="delivered">0</strong></article>
            </div>
            <p class="form-status customer-shipments-status" role="status" aria-live="polite"></p>
            <div class="user-table" id="customer-shipments-list"></div>
          </section>
        </div>
      </section>
    </main>
  </div>

  <script src="/script.js"></script>
</body>
</html>

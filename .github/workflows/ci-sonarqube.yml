name: CI and SonarQube

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: self-hosted
    permissions:
      contents: read
    steps:
      - name: Check out sources
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Run Maven verify with JaCoCo
        run: ./mvnw -B clean verify

      - name: Upload JaCoCo report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: target/site/jacoco/
          if-no-files-found: error

      - name: Publish SonarQube analysis
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        env:
          SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL || secrets.SONAR_HOST_URL }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_PROJECT_KEY: ${{ vars.SONAR_PROJECT_KEY }}
          SONAR_PROJECT_NAME: ${{ vars.SONAR_PROJECT_NAME }}
          SONAR_ORGANIZATION: ${{ vars.SONAR_ORGANIZATION }}
        run: |
          if [ -z "${SONAR_HOST_URL}" ]; then
            SONAR_HOST_URL="http://localhost:9000"
          fi

          if [ -z "${SONAR_TOKEN}" ]; then
            echo "Set GitHub secret SONAR_TOKEN before running SonarQube analysis."
            exit 1
          fi

          if [ -z "${SONAR_PROJECT_NAME}" ]; then
            SONAR_PROJECT_NAME="logisticsapplication"
          fi

          if [ ! -f "target/site/jacoco/jacoco.xml" ]; then
            echo "JaCoCo XML report was not found at target/site/jacoco/jacoco.xml"
            exit 1
          fi

          ls -l target/site/jacoco/jacoco.xml

          run_sonar() {
            ./mvnw -B org.sonarsource.scanner.maven:sonar-maven-plugin:5.5.0.6356:sonar "$@"
          }

          retry_sonar() {
            local attempt=1
            local max_attempts=3

            until run_sonar "$@"; do
              if [ "${attempt}" -ge "${max_attempts}" ]; then
                echo "Sonar analysis failed after ${attempt} attempts."
                return 1
              fi

              echo "Sonar analysis failed on attempt ${attempt}. Retrying in 15 seconds..."
              attempt=$((attempt + 1))
              sleep 15
            done
          }

          if [ "${SONAR_HOST_URL}" = "https://sonarcloud.io" ] || [ "${SONAR_HOST_URL}" = "https://sonarqubecloud.io" ]; then
            if [ -z "${SONAR_PROJECT_KEY}" ]; then
              echo "Set GitHub variable SONAR_PROJECT_KEY for SonarQube Cloud analysis."
              exit 1
            fi

            if [ -z "${SONAR_ORGANIZATION}" ]; then
              echo "Set GitHub variable SONAR_ORGANIZATION for SonarQube Cloud analysis."
              exit 1
            fi

            retry_sonar \
              -Dsonar.projectKey="${SONAR_PROJECT_KEY}" \
              -Dsonar.projectName="${SONAR_PROJECT_NAME}" \
              -Dsonar.host.url="${SONAR_HOST_URL}" \
              -Dsonar.organization="${SONAR_ORGANIZATION}" \
              -Dsonar.verbose=true \
              -Dsonar.token="${SONAR_TOKEN}"
          else
            if [ -z "${SONAR_PROJECT_KEY}" ]; then
              SONAR_PROJECT_KEY="com:logisticsapplication"
            fi

            retry_sonar \
              -Dsonar.projectKey="${SONAR_PROJECT_KEY}" \
              -Dsonar.projectName="${SONAR_PROJECT_NAME}" \
              -Dsonar.host.url="${SONAR_HOST_URL}" \
              -Dsonar.verbose=true \
              -Dsonar.token="${SONAR_TOKEN}"
          fi
